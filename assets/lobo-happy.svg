<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
  <!-- Body -->
  <ellipse cx="200" cy="360" rx="90" ry="100" fill="#F1EFE8"/>
  <ellipse cx="200" cy="385" rx="55" ry="65" fill="#FFFFFF"/>
  <!-- Tail wagging up -->
  <path d="M285 345 Q360 290 345 355 Q328 400 290 375Z" fill="#D3D1C7"/>
  <path d="M345 355 Q328 400 290 375 Q316 382 336 368Z" fill="#FFFFFF"/>
  <!-- Left ear -->
  <path d="M128 148 L100 60 L175 120Z" fill="#D3D1C7"/>
  <path d="M132 144 L108 72 L170 118Z" fill="#888780"/>
  <!-- Right ear -->
  <path d="M272 148 L300 60 L225 120Z" fill="#D3D1C7"/>
  <path d="M268 144 L292 72 L230 118Z" fill="#888780"/>
  <!-- Head tilted -->
  <g transform="rotate(-8 200 200)">
    <ellipse cx="200" cy="200" rx="105" ry="100" fill="#F1EFE8"/>
    <ellipse cx="200" cy="225" rx="70" ry="60" fill="#FFFFFF"/>
    <!-- Happy eyes closed -->
    <path d="M150 188 Q168 178 186 188" fill="none" stroke="#2C2C2A" stroke-width="5" stroke-linecap="round"/>
    <path d="M214 188 Q232 178 250 188" fill="none" stroke="#2C2C2A" stroke-width="5" stroke-linecap="round"/>
    <!-- Blush -->
    <ellipse cx="152" cy="208" rx="18" ry="10" fill="#F09595" fill-opacity="0.4"/>
    <ellipse cx="248" cy="208" rx="18" ry="10" fill="#F09595" fill-opacity="0.4"/>
    <!-- Nose -->
    <ellipse cx="200" cy="228" rx="12" ry="9" fill="#888780"/>
    <!-- Big smile -->
    <path d="M172 248 Q200 272 228 248" fill="none" stroke="#888780" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Arms raised -->
  <path d="M118 320 Q72 275 82 242" fill="none" stroke="#D3D1C7" stroke-width="32" stroke-linecap="round"/>
  <path d="M282 320 Q328 275 318 242" fill="none" stroke="#D3D1C7" stroke-width="32" stroke-linecap="round"/>
  <!-- Stars -->
  <text x="48" y="235" font-size="28" fill="#EF9F27" font-family="system-ui">★</text>
  <text x="310" y="228" font-size="22" fill="#EF9F27" font-family="system-ui">★</text>
  <text x="185" y="85" font-size="18" fill="#FAC775" font-family="system-ui">★</text>
  <!-- Legs -->
  <ellipse cx="172" cy="458" rx="30" ry="18" fill="#B4B2A9"/>
  <ellipse cx="228" cy="458" rx="30" ry="18" fill="#B4B2A9"/>
</svg>
