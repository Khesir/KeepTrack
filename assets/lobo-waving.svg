<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
  <!-- Body -->
  <ellipse cx="200" cy="360" rx="90" ry="100" fill="#F1EFE8"/>
  <ellipse cx="200" cy="385" rx="55" ry="65" fill="#FFFFFF"/>
  <!-- Tail -->
  <path d="M285 370 Q350 400 330 450 Q310 470 290 445 Q308 420 292 395Z" fill="#D3D1C7"/>
  <path d="M330 450 Q310 470 290 445 Q308 452 322 448Z" fill="#FFFFFF"/>
  <!-- Left ear -->
  <path d="M128 148 L100 60 L175 120Z" fill="#D3D1C7"/>
  <path d="M132 144 L108 72 L170 118Z" fill="#888780"/>
  <!-- Right ear -->
  <path d="M272 148 L300 60 L225 120Z" fill="#D3D1C7"/>
  <path d="M268 144 L292 72 L230 118Z" fill="#888780"/>
  <!-- Head -->
  <ellipse cx="200" cy="200" rx="105" ry="100" fill="#F1EFE8"/>
  <ellipse cx="200" cy="225" rx="70" ry="60" fill="#FFFFFF"/>
  <!-- Eyes friendly -->
  <circle cx="168" cy="188" r="22" fill="#2C2C2A"/>
  <circle cx="232" cy="188" r="22" fill="#2C2C2A"/>
  <circle cx="175" cy="180" r="7" fill="#FFFFFF"/>
  <circle cx="239" cy="180" r="7" fill="#FFFFFF"/>
  <!-- Blush -->
  <ellipse cx="148" cy="212" rx="16" ry="9" fill="#F09595" fill-opacity="0.35"/>
  <ellipse cx="252" cy="212" rx="16" ry="9" fill="#F09595" fill-opacity="0.35"/>
  <!-- Nose -->
  <ellipse cx="200" cy="228" rx="12" ry="9" fill="#888780"/>
  <!-- Smile -->
  <path d="M178 246 Q200 264 222 246" fill="none" stroke="#888780" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Waving arm right -->
  <path d="M282 310 Q340 260 352 210" fill="none" stroke="#D3D1C7" stroke-width="32" stroke-linecap="round"/>
  <!-- Paw -->
  <ellipse cx="356" cy="200" rx="26" ry="22" fill="#D3D1C7"/>
  <ellipse cx="344" cy="188" rx="10" ry="8" fill="#B4B2A9"/>
  <ellipse cx="358" cy="184" rx="10" ry="8" fill="#B4B2A9"/>
  <ellipse cx="370" cy="190" rx="10" ry="8" fill="#B4B2A9"/>
  <!-- Left arm down -->
  <path d="M118 330 Q85 355 92 390" fill="none" stroke="#D3D1C7" stroke-width="32" stroke-linecap="round"/>
  <!-- Legs -->
  <ellipse cx="172" cy="458" rx="30" ry="18" fill="#B4B2A9"/>
  <ellipse cx="228" cy="458" rx="30" ry="18" fill="#B4B2A9"/>
</svg>
